# Light theme matching the design reference under Files/BIR2307_Figma (a
# Figma Make mockup of this app's professional-SaaS redesign). Streamlit's
# native theme engine only supports one fixed palette per server process
# (this is that palette — the "light" default); the in-app light/dark
# toggle (app/ui/styles.py) additionally CSS-overrides native widget
# chrome for the dark variant, since config.toml itself can't be switched
# at runtime.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[client]
# Hides Streamlit's own "Deploy"/settings toolbar chrome — this is meant to
# read as a standalone product, not an app still under Streamlit Cloud dev.
toolbarMode = "minimal"
